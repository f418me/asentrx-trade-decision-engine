[project]
name = "asentrx-trade-decision-engine"
version = "0.1.0"
description = ""
authors = [{name = "Felix Frei", email = "felix.frei@gmx.ch"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115.12,<0.116",
    "uvicorn>=0.34.3,<0.35",
    "pydantic-ai-slim[typesafe]>=2.49.0,<3",
    "typesafe-sdk>=0.7.2,<0.8",
    "pydantic>=2.11.5,<3",
    "python-dotenv>=1.1.0,<2",
    "requests>=2.32.3,<3",
    "logfire>=4.0.0,<5",
    "sentry-sdk>=2.29.1,<3",
    "beautifulsoup4>=4.13.4,<5",
    "truthbrush",
    "bitfinex-api-py",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=8.4.0,<9",
    "pytest-mock>=3.14.1,<4",
    "requests-mock>=1.12.1,<2",
    "pytest-asyncio>=1.0.0,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
truthbrush = {git = "https://github.com/stanfordio/truthbrush.git", rev = "25f75b3187773420ca0ee28a0a1b8d24c4955326"}
bitfinex-api-py = {git = "https://github.com/f418me/bitfinex-api-py.git", rev = "2d7520ab990d348ee81db137594fc431b0b8bd37"}

[tool.pytest.ini_options]
pythonpath = [
  "."
]
markers = [
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end",
    "live_jev: opt-in live Jev API tests (requires TYPESAFE_API_KEY)",
    "live_llm: compatibility alias for live_jev; retained for existing offline test commands",
]

asyncio_mode = "auto"
